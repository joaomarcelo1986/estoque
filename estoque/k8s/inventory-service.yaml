apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: estoque-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory
        image: <OCIR_REPO>/inventory-service:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: estoque-app
spec:
  selector:
    app: inventory-service
  ports:
  - port: 80
    targetPort: 5000
